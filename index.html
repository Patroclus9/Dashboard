button{font:inherit;color:inherit;cursor:pointer}

.sub{color:var(--muted);font-size:14px;margin:2px 0 10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.row b{font-weight:600}
.row span{color:var(--muted)}
.empty{padding:28px 6px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:26px;margin-bottom:6px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:12px}
.toggle p{margin:0}.toggle small{color:var(--muted);display:block}
.sw{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:0 0 env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:14px 4px;font-weight:600;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(92vw,420px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{font-size:30px;margin-bottom:4px}
.chips{display:grid;gap:8px;margin:14px 0}
.chip{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;border-left:8px solid var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);background:var(--surface);box-shadow:inset 0 0 0 1px var(--c)}
.chip .l{margin-left:auto;color:var(--muted);font-size:14px}
.chip .t{font-weight:600}
.done{width:100%;background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:13px;font-weight:600}
.row span{text-align:right}.w{color:var(--accent)}.l{color:var(--muted)}.rv{padding:5px 10px;font-size:14px}
.seg{display:flex;gap:6px;margin:0 0 14px}

.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.g{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px}
.g .sub{margin:0}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mh h2{font-size:26px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.cal i{font-style:normal;text-align:center;color:var(--muted);font-size:13px;font-weight:600}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;padding:6px 0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.day[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day[aria-current="date"] span{font-weight:700;color:var(--accent)}
.day em{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:16px}
.day u,.bg{display:inline-block;height:16px;padding:0 5px;border-radius:8px;font:700 10px/16px Barlow,system-ui,sans-serif;color:#fff;text-decoration:none;letter-spacing:.02em}
.bg{margin-right:7px;vertical-align:1px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px;margin:0 0 12px}
.leg .bg{margin-right:5px}
.seg{flex-wrap:wrap}.seg button{flex:1 0 auto;min-width:0}
.st{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sr{display:grid;grid-template-columns:34px 1fr 56px 56px;gap:4px;padding:11px 14px;border-top:1px solid var(--line);align-items:center}
.sr.hd{border-top:0;color:var(--muted);font-size:14px;font-weight:600}
.sr.me{background:color-mix(in srgb,var(--c) 16%,var(--surface));font-weight:700;box-shadow:inset 6px 0 0 var(--c)}
.sr span:nth-child(n+3){text-align:right}
.sr small{color:var(--muted);font-weight:500}
.cut{border-top:2px dashed var(--accent);color:var(--accent);font-size:13px;font-weight:600;padding:3px 14px;background:var(--surface)}
.dots{display:flex;gap:6px;margin:0 0 12px}
.dots i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-style:normal;font-weight:700;color:var(--on-accent)}
.dots .w{background:var(--accent)}.dots .l{background:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif;display:block}
.stats span{color:var(--muted);font-size:13px}
.hc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px}
.hc .sub{margin:4px 0 0}.hc.wd{opacity:.6}
.act{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none}
.act .pill,a.pill{font-size:14px;padding:6px 12px;text-align:center;text-decoration:none;color:var(--ink);display:block}
.act a.pill{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
a.card{display:block;color:inherit;text-decoration:none}
.sec{font-size:24px;margin:18px 0 8px}
.lk{font-weight:600;color:var(--accent);text-decoration:none}
.hb{display:flex;gap:8px;flex:none}
@media (max-width:400px){.hb .pill{padding:7px 11px;font-size:15px}.hb{gap:6px}header{gap:8px}}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#bg svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 60%,transparent),color-mix(in srgb,var(--bg) 26%,transparent) 55%,color-mix(in srgb,var(--bg) 18%,transparent))}
header h1,.wx,.scs,.sec,main>.sub,.empty{text-shadow:0 0 3px var(--bg),0 0 8px var(--bg),0 0 14px var(--bg)}
.wx{max-width:640px;margin:0 auto;padding:0 18px;color:var(--muted);font-size:14px}
.wx:empty{display:none}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(var(--h))}}
@keyframes drift{from{transform:translateX(-2.5%)}to{transform:translateX(2.5%)}}
@keyframes flash{0%,90%,100%{opacity:0}92%{opacity:.9}94%{opacity:.1}96%{opacity:.8}}
.fx{animation:fall linear infinite;will-change:transform}
.cl{animation:drift 90s ease-in-out infinite alternate;will-change:transform}
.flash{opacity:0;animation:flash 7s linear infinite}
@media (prefers-reduced-motion:reduce){.fx,.cl,.flash{animation:none}}
.bar{display:flex;align-items:center;gap:12px;max-width:640px;margin:0 auto;padding:0 18px 6px}
.bar .wx{padding:0;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scs{white-space:nowrap;flex:none;display:flex;align-items:center;gap:8px;margin-left:auto;font-weight:600;font-size:15px}
.hw{margin:0 0 12px}.hw .card{margin:0}.hw .card.op{border-bottom-left-radius:0;border-bottom-right-radius:0}
.vid{aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;overflow:hidden}
.vid iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
